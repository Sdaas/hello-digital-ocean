name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dev dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats zsh

      - name: Run test suite
        run: ./test.sh
