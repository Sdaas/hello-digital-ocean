<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>digital-ocean demo chat</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
      background: Canvas; color: CanvasText;
    }
    header {
      padding: .75rem 1rem; border-bottom: 1px solid rgba(128,128,128,.3);
      font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }
    header .env { font-weight: 400; opacity: .7; font-size: .85rem; }
    #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
    .msg { max-width: 46rem; padding: .5rem .8rem; border-radius: .8rem; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: rgba(128,128,128,.18); }
    .meta { align-self: center; opacity: .6; font-size: .8rem; }
    form { display: flex; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid rgba(128,128,128,.3); }
    #box { flex: 1; padding: .55rem .7rem; border-radius: .6rem; border: 1px solid rgba(128,128,128,.5);
           background: Field; color: FieldText; font: inherit; }
    button { padding: .55rem 1rem; border: 0; border-radius: .6rem; background: #2563eb; color: #fff;
             font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <span>digital-ocean demo chat</span>
    <span class="env" id="env"></span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="box" autocomplete="off" placeholder="Type a message and press Enter" autofocus />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    // Same-origin, relative URLs only (ADR 0004): the UI never knows the host.
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const box = document.getElementById("box");
    const send = document.getElementById("send");

    function add(role, content) {
      const el = document.createElement("div");
      el.className = "msg " + (role === "user" ? "user" : "assistant");
      el.textContent = content;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function loadHistory() {
      try {
        const r = await fetch("/history");
        const data = await r.json();
        (data.messages || []).forEach(m => add(m.role, m.content));
      } catch (e) { /* first run: nothing yet */ }
    }

    async function loadEnv() {
      try {
        const r = await fetch("/health");
        const h = await r.json();
        document.getElementById("env").textContent = h.app_env + " · " + h.model;
      } catch (e) { /* ignore */ }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = box.value.trim();
      if (!message) return;
      add("user", message);
      box.value = "";
      box.disabled = send.disabled = true;
      const thinking = add("assistant", "…");
      try {
        const r = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await r.json();
        thinking.textContent = r.ok ? data.reply : ("⚠ " + (data.error || "request failed"));
      } catch (err) {
        thinking.textContent = "⚠ network error";
      } finally {
        box.disabled = send.disabled = false;
        box.focus();
      }
    });

    loadEnv();
    loadHistory();
  </script>
</body>
</html>
